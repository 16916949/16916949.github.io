

<!DOCTYPE html>
<html lang="zh-CN" data-width="760" data-columns="3" data-drop-cap="false" data-style="darkgallery" data-mega="true" data-quote="true">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>/* ============================================================
   10-DarkGallery 暗廊
   暗黑美术馆：纯黑底 + 古金 + Cormorant 斜体 + 四列巨型菜单
   ============================================================ */
{# C7：CSS 模板化 #}
:root {
    --bg: #0d0d0d;
    --card: #161616;
    --bg-light: #1a1a1a;
    --text: #e8e0d5;
    --text-2: #8a8075;
    --gold: ;
    --gold-light: #e0c98f;
    --gold-dark: #9a7d3f;
    --wine: #8b2635;
    --border: #2a2a2a;
    --content-width: px;
    --max-width: 1200px;
    --radius: 2px;
    --transition: 0.3s ease;
    --font-display: "Playfair Display", "Noto Serif SC", "Songti SC", SimSun, serif;
    --font-body: "Cormorant Garamond", "Noto Serif SC", "Songti SC", Georgia, serif;
    --font-mono: "Courier New", Courier, Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
p, h1, h2, h3, h4, h5, h6, li, blockquote, code, pre, img, a { -webkit-user-select: text; user-select: text; }
pre, code { touch-action: pan-x pan-y; }

html { scroll-behavior: smooth; }
body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.85;
    font-size: 17px;
    /* FAB 悬浮方案：移除全局底部占位 */
    animation: grideaPageEnter 0.3s ease both;
}
body.gridea-page-leaving { animation: grideaPageLeave 0.2s ease forwards; }
@keyframes grideaPageEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes grideaPageLeave { from { opacity: 1; } to { opacity: 0; } }

a { color: var(--gold); text-decoration: none; transition: color var(--transition); }
a:hover { color: var(--gold-light); }
img { max-width: 100%; height: auto; }
.container { max-width: var(--max-width); margin: 0 auto; padding: 0 40px; }
.page { padding-top: 30px; padding-bottom: 60px; }

/* ===== 顶栏 ===== */
.top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 160; height: 70px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 36px;
    background: rgba(13, 13, 13, 0.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}
.gallery-logo { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 1.35rem; color: var(--gold); letter-spacing: 0.06em; }
.gallery-logo:hover { color: var(--gold-light); }
.site-nav { display: flex; align-items: center; gap: 16px; }
.nav-links-top { display: flex; align-items: center; gap: 4px; }
.nav-link {
    display: inline-block; padding: 8px 14px; color: var(--text-2); font-size: 0.95rem;
    border: 1px solid transparent; border-radius: 999px;
}
.nav-link:hover { color: var(--gold); border-color: var(--border); }
.nav-icon { font-size: 1rem; color: var(--text-2); }
.nav-toggle {
    display: none; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--gold); background: rgba(201, 169, 98, 0.14); cursor: pointer;
    flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.nav-toggle-bar { width: 18px; height: 2px; background: #fff; transition: all 0.25s; }
.nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(1) { transform: translateY(4px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] .nav-toggle-bar:nth-child(3) { transform: translateY(-4px) rotate(-45deg); }

/* 四列巨型菜单 */
.mega-trigger { position: relative; }
.mega-panel {
    display: grid; position: absolute; top: calc(100% + 12px); right: -20px;
    width: 900px; grid-template-columns: 1fr 1fr 1fr 1.2fr; gap: 26px;
    background: var(--bg-light); border: 1px solid var(--border);
    padding: 26px 28px; z-index: 170;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    opacity: 0; visibility: hidden; transform: translateY(8px);
    transition: opacity 0.25s ease, visibility 0.25s, transform 0.25s ease;
}
.mega-trigger:hover .mega-panel, .mega-trigger:focus-within .mega-panel, .mega-panel.open { opacity: 1; visibility: visible; transform: none; }
.mega-btn { cursor: pointer; user-select: none; }
.mega-title {
    font-family: var(--font-display); font-style: italic; font-size: 0.95rem;
    color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px;
}
.mega-link { display: block; padding: 6px 0; color: var(--text-2); font-size: 0.95rem; }
.mega-link:hover { color: var(--gold); padding-left: 6px; }
.mega-note { display: block; padding: 4px 0; color: var(--text-2); font-size: 0.9rem; }
.mega-feature {
    background: linear-gradient(160deg, var(--gold-dark), var(--wine) 70%);
    padding: 20px; color: #fff;
}
.mega-feature .mega-title { color: #fff; border-color: rgba(255, 255, 255, 0.3); }
.mega-feature-text { display: block; font-family: var(--font-display); font-style: italic; font-size: 1.3rem; margin-bottom: 8px; }
.mega-feature .mega-note { color: rgba(255, 255, 255, 0.8); }
html[data-mega="false"] .mega-trigger { display: none; }

/* ===== hero ===== */
.hero {
    min-height: 100vh; padding: 120px 40px 80px;
    display: grid; grid-template-columns: 1fr 1.2fr; gap: 50px; align-items: center;
    max-width: var(--max-width); margin: 0 auto;
}
.hero-kicker { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.3em; color: var(--text-2); }
.hero-title { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: clamp(2.6rem, 6vw, 4.4rem); line-height: 1.15; margin-top: 16px; color: var(--text); }
.hero-title em { color: var(--gold); }
.hero-desc { color: var(--text-2); margin-top: 20px; max-width: 420px; font-size: 1.1rem; }
.hero-cta {
    display: inline-block; margin-top: 34px; border: 1px solid var(--gold); color: var(--gold);
    padding: 13px 34px; letter-spacing: 0.08em; transition: all 0.3s;
}
.hero-cta:hover { background: var(--gold); color: var(--bg); }
.hero-art { position: relative; height: 520px; }
.frame {
    position: absolute; border: 1px solid var(--gold); padding: 14px;
}
.frame-inner { display: block; width: 100%; height: 100%; background: linear-gradient(150deg, #2b2b2b, #141414); }
.frame-1 { width: 360px; height: 460px; top: 0; right: 20px; transform: rotate(1.6deg); }
.frame-2 { width: 300px; height: 400px; bottom: 0; left: 0; transform: rotate(-2.4deg); background: rgba(13, 13, 13, 0.6); }

/* ===== 大引文 ===== */
.big-quote {
    position: relative; text-align: center; padding: 90px 20px;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    max-width: 900px; margin: 0 auto 70px;
}
.quote-mark {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 8rem; line-height: 1; color: rgba(201, 169, 98, 0.14);
}
.quote-text { font-family: var(--font-display); font-style: italic; font-size: 2rem; color: var(--text); position: relative; }
.quote-attr { color: var(--text-2); margin-top: 14px; font-size: 0.95rem; }
html[data-quote="false"] .big-quote { display: none; }

/* ===== 画廊卡 ===== */
.gallery {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px;
    max-width: var(--max-width); margin: 0 auto; padding: 0 40px 40px;
}
html[data-columns="1"] .gallery { grid-template-columns: 1fr; }
html[data-columns="2"] .gallery { grid-template-columns: repeat(2, 1fr); }
.art-card { color: var(--text); display: flex; flex-direction: column; gap: 12px; }
.art-card { min-width: 0; }
.art-cover {
    position: relative; aspect-ratio: 3 / 4; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
}
.art-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
.art-gradient { display: block; width: 100%; height: 100%; background: linear-gradient(160deg, #3a3a3a, #151515); }
.art-cover.cover-fallback img, .trip-cover.cover-fallback img, .featured-cover.cover-fallback img { display: none; }
.art-mask {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 22px; background: linear-gradient(transparent 45%, rgba(0, 0, 0, 0.85));
    opacity: 0; transition: opacity 0.35s ease;
}
.art-card:hover .art-mask { opacity: 1; }
.art-card:hover .art-cover img { transform: scale(1.05); }
.art-title { font-family: var(--font-display); font-style: italic; font-size: 1.2rem; color: #fff; }
.art-date { font-family: var(--font-mono); font-size: 0.74rem; color: var(--gold); margin-top: 4px; }
.art-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 0.84rem; }
.art-no { font-family: var(--font-display); font-style: italic; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.art-read { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-2); white-space: nowrap; }
.art-tags { display: flex; gap: 10px; font-style: normal; }
.art-tags em { color: var(--gold-dark); font-style: normal; font-size: 0.8rem; }
.empty {
    border: 1px dashed var(--border); padding: 44px; text-align: center;
    color: var(--text-2); grid-column: 1 / -1; font-family: var(--font-mono);
}

/* ===== 分页 ===== */
.pagination { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 40px 50px; font-family: var(--font-mono); font-size: 0.8rem; }
.page-prev, .page-next { border: 1px solid var(--border); color: var(--text-2); padding: 9px 22px; }
.page-prev:hover, .page-next:hover { border-color: var(--gold); color: var(--gold); }
.page-info { color: var(--text-2); letter-spacing: 0.12em; }

/* ===== 文章详情 ===== */
.post-detail { max-width: var(--content-width); margin: 0 auto; padding: 100px 24px 40px; }
.post-header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 28px; }
.post-kicker { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.2em; color: var(--text-2); }
.post-title { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 2.2rem; line-height: 1.35; margin-top: 10px; }
.post-title em { color: var(--gold); }
.post-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 14px; font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-2); }
.post-tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.tag-chip { font-family: var(--font-mono); font-size: 0.72rem; color: var(--gold); border: 1px solid var(--border); padding: 3px 12px; }
.tag-chip:hover { border-color: var(--gold); color: var(--gold); }
.post-feature { margin-bottom: 26px; border: 1px solid var(--border); }
.post-feature-img { width: 100%; display: block; }
.post-toc { border: 1px solid var(--border); background: var(--bg-light); padding: 15px 19px; margin-bottom: 26px; font-size: 0.95rem; }
.post-toc a { color: var(--gold); }

.post-content { font-size: 1.12rem; }
.post-content h2 { font-family: var(--font-display); font-style: italic; font-size: 1.55rem; color: var(--gold); margin: 36px 0 14px; }
.post-content h3 { font-size: 1.25rem; color: var(--text); margin: 26px 0 10px; }
.post-content p { margin: 0 0 17px; }
.post-content a { border-bottom: 1px solid rgba(201, 169, 98, 0.4); }
.post-content ul, .post-content ol { margin: 0 0 17px 26px; }
.post-content li { margin-bottom: 6px; }
.post-content blockquote {
    border-left: 3px solid var(--gold); background: var(--bg-light);
    padding: 16px 22px; margin: 0 0 17px; font-style: italic; color: var(--text-2);
}
.post-content pre {
    background: var(--bg-light); border: 1px solid var(--border); border-left: 3px solid var(--gold);
    padding: 16px 18px; overflow-x: auto; margin: 0 0 17px; position: relative; font-size: 0.9rem;
}
.post-content code { font-family: var(--font-mono); font-size: 0.88em; background: rgba(201, 169, 98, 0.12); padding: 2px 5px; }
.post-content pre code { background: none; padding: 0; }
.post-content img { border: 1px solid var(--border); }
.post-content hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
.post-content table { width: 100%; border-collapse: collapse; margin: 0 0 17px; font-size: 0.98rem; }
.post-content th, .post-content td { border: 1px solid var(--border); padding: 9px 11px; text-align: left; }
.post-content th { background: var(--bg-light); color: var(--gold); }
.code-copy-btn {
    position: absolute; top: 8px; right: 8px; cursor: pointer;
    font-family: var(--font-mono); font-size: 0.7rem;
    background: rgba(232, 224, 213, 0.1); color: var(--text);
    border: 1px solid var(--border); padding: 3px 10px;
}
.code-copy-btn.copied { color: #9fd8a0; border-color: #9fd8a0; }
html[data-drop-cap="true"] .post-content > p:first-of-type::first-letter {
    font-size: 58px; float: left; line-height: 0.85; margin: 6px 10px 0 0;
    color: var(--gold); font-family: var(--font-display);
}

.post-navigation { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 36px 0 10px; }
.post-nav {
    border: 1px solid var(--border); background: var(--bg-light); padding: 17px 20px;
    display: flex; flex-direction: column; gap: 7px; color: var(--text);
}
.post-nav:hover { border-color: var(--gold); color: var(--text); }
.post-nav.next { text-align: right; }
.nav-label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-2); letter-spacing: 0.12em; }
.nav-title { font-family: var(--font-display); font-style: italic; font-size: 1.05rem; }
.post-nav:hover .nav-title { color: var(--gold); }

/* ===== 归档/标签/友链 ===== */
.page-title { font-family: var(--font-display); font-style: italic; font-size: 1.9rem; margin-bottom: 8px; }
.page-rule { height: 1px; background: linear-gradient(90deg, var(--gold), transparent); margin-bottom: 26px; }
.archive-year { margin-bottom: 26px; }
.archive-year-title { font-family: var(--font-mono); font-size: 0.9rem; color: var(--gold); letter-spacing: 0.14em; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 10px; }
.archive-list { list-style: none; }
.archive-item { display: flex; align-items: baseline; gap: 14px; padding: 9px 0; border-bottom: 1px dotted var(--border); }
.archive-date { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-2); min-width: 92px; }
.archive-title { color: var(--text); font-size: 1.05rem; }
.archive-title:hover { color: var(--gold); }
.tags-cloud { display: flex; flex-wrap: wrap; gap: 12px; }
.tag-card {
    border: 1px solid var(--border); color: var(--text-2); padding: 10px 20px;
    display: inline-flex; gap: 8px; align-items: center;
}
.tag-card:hover { border-color: var(--gold); color: var(--gold); }
.tag-count { font-family: var(--font-mono); font-size: 0.78rem; color: var(--gold-dark); }
.friend-links-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.friend-link-card {
    border: 1px solid var(--border); background: var(--bg-light); padding: 20px;
    display: flex; gap: 14px; align-items: center; color: var(--text);
}
.friend-link-card:hover { border-color: var(--gold); color: var(--text); }
.friend-link-avatar { width: 54px; height: 54px; object-fit: cover; border-radius: 50%; border: 1px solid var(--border); flex-shrink: 0; }
.friend-link-name { font-family: var(--font-display); font-style: italic; font-size: 1.1rem; }
.friend-link-desc { font-size: 0.86rem; color: var(--text-2); margin-top: 4px; }

/* ===== 错误页 ===== */
.error-page { text-align: center; padding: 120px 20px 80px; }
.error-code { font-family: var(--font-display); font-style: italic; font-size: 5.5rem; color: var(--gold); }
.error-message { color: var(--text-2); margin-top: 10px; letter-spacing: 0.14em; font-family: var(--font-mono); }
.error-desc { color: var(--text-2); margin-top: 8px; }
.error-back-home { display: inline-block; margin-top: 30px; border: 1px solid var(--gold); color: var(--gold); padding: 12px 30px; }
.error-back-home:hover { background: var(--gold); color: var(--bg); }

/* ===== 页脚 ===== */
.gallery-footer { background: var(--bg-light); border-top: 1px solid var(--border); margin-top: 30px; }
.gallery-footer .container { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 30px; padding-top: 34px; padding-bottom: 34px; }
.footer-title { font-family: var(--font-display); font-style: italic; font-size: 1rem; color: var(--gold); margin-bottom: 12px; }
.footer-desc { color: var(--text-2); font-size: 0.9rem; }
.footer-link { display: block; padding: 4px 0; color: var(--text-2); font-size: 0.9rem; }
.footer-link:hover { color: var(--gold); }
.social-link {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 50%;
}
.social-link svg { display: block; }

/* ===== 通用组件 ===== */
.reading-progress-container { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 999; pointer-events: none; background: rgba(232, 224, 213, 0.08); }
.reading-progress-bar { height: 100%; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform 0.05s linear; }
.back-to-top {
    position: fixed; bottom: 32px; right: 32px; width: 46px; height: 46px;
    background: var(--bg-light); color: var(--gold); border: 1px solid var(--border);
    font-size: 18px; cursor: pointer; opacity: 0; transform: translateY(10px);
    transition: opacity var(--transition), transform var(--transition); z-index: 998;
}
.back-to-top.visible { opacity: 1; transform: translateY(0); }
.back-to-top:hover { background: var(--gold); color: var(--bg); }
.image-zoom-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.96);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.image-zoom-overlay.visible { opacity: 1; pointer-events: auto; }
.image-zoom-img { max-width: 90vw; max-height: 90vh; border: 1px solid var(--gold); }

/* ===== 平板 (769-1024px) ===== */
@media (min-width: 769px) and (max-width: 1024px) {
    .container { padding: 0 28px; }
    body { font-size: 16px; }
    .hero { grid-template-columns: 1fr; padding: 110px 28px 60px; }
    .hero-art { height: 380px; }
    .frame-1 { width: 280px; height: 340px; }
    .frame-2 { width: 230px; height: 300px; }
    .gallery { grid-template-columns: repeat(2, 1fr); padding: 0 28px 36px; }
    html[data-columns="3"] .gallery { grid-template-columns: repeat(2, 1fr); }
    .mega-panel { width: 720px; }
    .friend-links-list { grid-template-columns: 1fr; }
    .gallery-footer .container { grid-template-columns: 1fr 1fr; }
}

/* ===== 桌面 (>1024px) ===== */
@media (min-width: 1025px) {
    .container { padding: 0 40px; }
    body { font-size: 17px; }
}

/* ===== 手机 (≤768px) ===== */
@media (max-width: 768px) {
    .container { padding: 0 20px; }
    body { font-size: 15.5px; }
    .top-bar { height: 60px; padding: 0 18px; }
    .nav-toggle { display: flex; }
    .nav-icon { display: none; }
    .site-nav { position: relative; }
    .nav-links-top {
        display: none; flex-direction: column; position: absolute; top: calc(100% + 12px);
        right: 0; width: 240px; background: var(--bg-light); border: 1px solid var(--border);
        padding: 12px 16px; z-index: 180; gap: 2px;
    }
    .nav-links-top {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100vh;
        background: var(--bg-light); flex-direction: column; justify-content: flex-start;
        align-items: center; padding: 80px 24px 30px; overflow-y: auto; z-index: 300; gap: 8px;
    }
    .nav-links-top.nav-links-open, .nav-links-top.is-open, .nav-links-top.open { display: flex; }
    .nav-link { padding: 12px 4px; border-bottom: 1px dotted var(--border); border-radius: 0; font-size: 1.05rem; }
    .nav-link:last-child { border-bottom: none; }
    .mega-trigger { display: none; }
    .nav-toggle { z-index: 310; }
    .art-mask { opacity: 1; }
    .art-read { display: none; }
    .hero { grid-template-columns: 1fr; padding: 100px 20px 50px; min-height: auto; }
    .hero-art { height: 320px; }
    .frame-1 { width: 230px; height: 280px; right: 0; }
    .frame-2 { width: 190px; height: 240px; }
    .gallery { grid-template-columns: 1fr; padding: 0 20px 30px; }
    html[data-columns="3"] .gallery { grid-template-columns: 1fr; }
    .big-quote { padding: 60px 20px; }
    .quote-text { font-size: 1.5rem; }
    .post-detail { padding: 90px 18px 30px; }
